<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Sandeep Explores</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      body {
        background: #0f0d0b;
        color: #f7efe9;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      .page-shell {
        width: min(1200px, 92vw);
        margin: 0 auto;
        padding: 80px 0 60px;
      }
      .page-top {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 28px;
      }
      .page-top h1 {
        margin: 0.5rem 0 0;
        font-size: clamp(2.5rem, 5vw, 4.4rem);
        letter-spacing: -0.08em;
      }
      .gallery-layout {
        display: grid;
        grid-template-columns: 1.4fr 0.7fr;
        gap: 26px;
      }
      .slideshow-gallery { grid-template-columns: 1fr; }
      .slideshow-gallery .feature-panel img {
        height: min(76vh, 820px);
        min-height: 420px;
      }
      .slideshow-gallery .feature-copy { padding: 18px 24px; }
      .slideshow-gallery .feature-copy .label,
      .slideshow-gallery .feature-copy h2,
      .slideshow-gallery .feature-copy p,
      .slideshow-gallery .thumb span { display: none; }
      .slideshow-gallery .thumbs {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
      }
      .slideshow-gallery .thumb { padding: 8px; }
      .slideshow-gallery .thumb img { height: 220px; }
      .feature-panel {
        background: rgba(26, 20, 16, 0.8);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 30px 70px rgba(0,0,0,0.2);
      }
      .feature-panel img {
        width: 100%;
        height: 560px;
        object-fit: cover;
        display: block;
      }
      .feature-copy {
        padding: 26px 24px 30px;
      }
      .feature-copy .label {
        color: #ffaf72;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 800;
      }
      .feature-copy h2 {
        margin: 0.9rem 0 0.7rem;
        font-size: clamp(2rem, 2.8vw, 3rem);
        letter-spacing: -0.06em;
      }
      .feature-copy p {
        margin: 0;
        color: #d7c4b7;
        line-height: 1.8;
      }
      .thumbs {
        display: grid;
        gap: 16px;
      }
      .thumb {
        font: inherit;
        color: inherit;
        background: rgba(27, 20, 15, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 10px;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }
      .thumb:hover {
        transform: translateY(-2px);
        border-color: rgba(255,122,26,0.7);
      }
      .thumb.active {
        border-color: rgba(255,122,26,0.9);
      }
      .thumb img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border-radius: 12px;
        display: block;
      }
      .thumb span {
        display: block;
        margin-top: 10px;
        font-size: 0.85rem;
        font-weight: 700;
        color: #f8d6b5;
      }
      .controls {
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }
      .btn-small {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.8rem 1.1rem;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.08);
        background: transparent;
        color: #f7efe9;
        cursor: pointer;
        font-weight: 700;
      }
      .btn-orange {
        background: linear-gradient(135deg, #ff7a1a, #ff9d4e);
        color: #1f120d;
        border-color: transparent;
      }
      @media (max-width: 900px) {
        .gallery-layout { grid-template-columns: 1fr; }
        .page-top { display: block; }
      }
      @media (max-width: 600px) {
        .slideshow-gallery .feature-panel img { height: 62vh; min-height: 320px; }
        .slideshow-gallery .thumbs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .slideshow-gallery .thumb img { height: 170px; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="page-top">
        <div>
          <div class="kicker" id="pageKicker">Gallery</div>
          <h1 id="pageTitle">My moments</h1>
        </div>
        <a class="btn btn-outline" href="index.html">← Back home</a>
      </div>

      <div class="gallery-layout">
        <div class="feature-panel">
          <img id="mainImage" src="" alt="Featured gallery image" />
          <div class="feature-copy">
            <div class="label" id="imageTag">Story</div>
            <h2 id="mainTitle">Loading...</h2>
            <p id="mainDesc">Loading description...</p>
            <div class="controls">
              <button class="btn-small" id="prevBtn" type="button">← Prev</button>
              <button class="btn-small btn-orange" id="nextBtn" type="button">Next →</button>
            </div>
          </div>
        </div>

        <div class="thumbs" id="thumbs"></div>
      </div>
    </div>

    <script>
      const galleryData = {
        hyderabad: {
          title: 'HYD',
          items: [
            { tag: 'HYD', title: 'Photo 1', description: '', image: 'media/hyd/20260709_155503.jpg' },
            { tag: 'HYD', title: 'Photo 2', description: '', image: 'media/hyd/20260709_155505.jpg' },
            { tag: 'HYD', title: 'Photo 3', description: '', image: 'media/hyd/20260805_145826.jpg' },
            { tag: 'HYD', title: 'Photo 4', description: '', image: 'media/hyd/IMG_20260622_101156_390.jpg' },
            { tag: 'HYD', title: 'Photo 5', description: '', image: 'media/hyd/IMG_20260622_101156_470.jpg' },
            { tag: 'HYD', title: 'Photo 6', description: '', image: 'media/hyd/IMG_20260622_101156_546.jpg' },
            { tag: 'HYD', title: 'Photo 7', description: '', image: 'media/hyd/IMG_20261029_210633_558.jpg' },
            { tag: 'HYD', title: 'Photo 8', description: '', image: 'media/hyd/IMG_20261029_210633_634.jpg' },
            { tag: 'HYD', title: 'Photo 9', description: '', image: 'media/hyd/Screenshot_20260804_131444_Instagram(1).jpg' }
          ]
        },
        snaps: {
          title: 'Quick snaps',
          items: [
            { tag: 'Candid', title: 'Little things', description: 'The real magic is usually in the in-between moments — not the planned frame, but the one that feels alive.', image: 'media/snaps/20260805_145826.jpg' },
            { tag: 'Daily life', title: 'Street details', description: 'Snapshots from everyday life, where texture, expression, and light tell a bigger story than words ever could.', image: 'media/festive/IMG_20261011_220111_046.jpg' },
            { tag: 'Moodboard', title: 'Quiet corners', description: 'A few honest frames can say more about a place than a whole travel itinerary.', image: 'media/snaps/IMG_20261029_210633_558.jpg' }
          ]
        },
        festivals: {
          title: 'Festive energy',
          items: [
            { tag: 'Celebration', title: 'Ganesh festival', description: 'A vibrant moment of devotion, color, and celebration that fills the air with joy and movement.', image: 'media/festive/IMG_20261011_220111_046.jpg' },
            { tag: 'Tradition', title: 'Festival lights', description: 'The quiet glow, the rituals, and the emotional energy that make festive moments feel unforgettable.', image: 'media/festive/IMG_20261011_220111_719.jpg' },
            { tag: 'Crowd mood', title: 'Celebration rush', description: 'Crowds, colors, prayers, and shared excitement come together in one powerful, uplifting scene.', image: 'media/snaps/20260709_155503.jpg' }
          ]
        },
        movie: {
          title: 'Movies',
          items: [
            { tag: 'Movie', title: 'Movie image 1', description: '', image: 'media/movie/download%20(1).jpg' },
            { tag: 'Movie', title: 'Movie image 2', description: '', image: 'media/movie/download%20(2).jpg' },
            { tag: 'Movie', title: 'Movie image 3', description: '', image: 'media/movie/download%20(3).jpg' },
            { tag: 'Movie', title: 'Movie image 4', description: '', image: 'media/movie/images%20(1).jpg' },
            { tag: 'Movie', title: 'Movie image 5', description: '', image: 'media/movie/images%20(2).jpg' }
          ]
        },
        travel: {
          title: 'Travel',
          items: [
            { tag: 'Travel', title: 'Travel image 1', description: '', image: 'media/travel/images.jpg' }
          ]
        },
        ai: {
          title: 'AI imagination',
          items: [
            { tag: 'AI', title: 'AI image 1', description: '', image: 'media/ai/1794392831866.png' },
            { tag: 'AI', title: 'AI image 2', description: '', image: 'media/ai/1794393008760.png' },
            { tag: 'AI', title: 'AI image 3', description: '', image: 'media/ai/1794393140427.png' },
            { tag: 'AI', title: 'AI image 4', description: '', image: 'media/ai/1794393429567.png' },
            { tag: 'AI', title: 'AI image 5', description: '', image: 'media/ai/1794397437637(1).png' },
            { tag: 'AI', title: 'AI image 6', description: '', image: 'media/ai/1794405759933.png' }
          ]
        }
      };

      const params = new URLSearchParams(window.location.search);
      const key = params.get('cat') || 'hyderabad';
      const data = galleryData[key] || galleryData.hyderabad;
      let index = 0;

      const pageTitle = document.getElementById('pageTitle');
      const pageKicker = document.getElementById('pageKicker');
      const galleryLayout = document.querySelector('.gallery-layout');
      const mainImage = document.getElementById('mainImage');
      const imageTag = document.getElementById('imageTag');
      const mainTitle = document.getElementById('mainTitle');
      const mainDesc = document.getElementById('mainDesc');
      const thumbs = document.getElementById('thumbs');

      pageKicker.hidden = true;
      galleryLayout.classList.add('slideshow-gallery');
      document.querySelector('.feature-copy .label').hidden = true;
      mainTitle.hidden = true;
      mainDesc.hidden = true;

      function render() {
        pageTitle.textContent = data.title;
        const item = data.items[index];
        mainImage.src = item.image;
        mainImage.alt = `${data.title} photo ${index + 1}`;
        imageTag.textContent = item.tag;
        mainTitle.textContent = item.title;
        mainDesc.textContent = item.description;

        thumbs.innerHTML = data.items.map((entry, i) => ({ entry, i }))
          .filter(({ i }) => i !== index)
          .map(({ entry, i }) => `
            <button class="thumb" type="button" data-index="${i}" aria-label="Show ${data.title} photo ${i + 1}">
              <img src="${entry.image}" alt="${data.title} photo ${i + 1}" />
            </button>
          `).join('');

        thumbs.querySelectorAll('.thumb').forEach((thumbEl) => {
          thumbEl.addEventListener('click', () => {
            index = Number(thumbEl.dataset.index);
            render();
          });
        });
      }

      document.getElementById('prevBtn').addEventListener('click', () => {
        index = (index - 1 + data.items.length) % data.items.length;
        render();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        index = (index + 1) % data.items.length;
        render();
      });

      render();
    </script>
  </body>
</html>
