<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Sandeep Explores</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-theme="dark">
    <main class="auth-layout">
      <section class="auth-card">
        <div class="auth-top">
          <a class="brand" href="index.html">Sandeep<span>Explores</span></a>
          <h1>Welcome back</h1>
          <p>Sign in to continue your next adventure.</p>
        </div>

        <form class="auth-form" id="signInForm">
          <div class="form-floating">
            <label for="signinEmail">Email address</label>
            <input id="signinEmail" type="email" placeholder="name@example.com" required />
          </div>

          <div class="form-floating">
            <label for="signinPassword">Password</label>
            <input id="signinPassword" type="password" placeholder="Enter your password" required />
          </div>

          <button class="btn btn-orange" type="submit">Sign in</button>
        </form>

        <p class="switch-text">New here? <a href="sign-up.html">Create an account</a></p>
        <div id="authMessage" class="auth-message" aria-live="polite"></div>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
